name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable version without the v prefix
        required: true
        type: string

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - name: Check out unity-links
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Require master
        shell: pwsh
        run: |
          if ("${{ github.ref }}" -ne "refs/heads/master") {
            throw "Release workflow must run from master."
          }

      - name: Validate release metadata
        shell: pwsh
        run: node ./scripts/release/validate-release.mjs $env:GITHUB_WORKSPACE $env:RELEASE_VERSION

      - name: Run PowerShell tests
        shell: pwsh
        env:
          UNITY_LINKS_SKIP_UNITY_PROJECT_TESTS: "1"
        run: pwsh -NoProfile -File ./scripts/tests/Run-Tests.ps1

      - name: Run Codex tweak tests
        shell: pwsh
        run: node --test ./codex-tweak/test/index.test.js

      - name: Run Claude tweak tests
        shell: pwsh
        run: npm test --prefix ./claude-tweak

      - name: Run release validator tests
        shell: pwsh
        run: node --test ./scripts/release/validate-release.test.mjs

      - name: Check diff formatting
        shell: pwsh
        run: git diff --check

      - name: Check out pinned Codex++
        uses: actions/checkout@v6
        with:
          repository: kpkhxlgy0/codex-plusplus
          ref: 19f6aa933f0ed673ea1bc350fec1d26c1b87531c
          path: .release-tools/codex-plusplus
          persist-credentials: false

      - name: Build Codex++ validator
        shell: pwsh
        working-directory: .release-tools/codex-plusplus
        run: |
          npm ci --ignore-scripts
          npm run build --workspace @codex-plusplus/sdk
          npm run build --workspace codex-plusplus

      - name: Validate tweak with Codex++
        shell: pwsh
        run: |
          node .\.release-tools\codex-plusplus\packages\installer\dist\cli.js `
            validate-tweak (Resolve-Path .\codex-tweak).Path

      - name: Check out pinned Claude++
        uses: actions/checkout@v6
        with:
          repository: kpkhxlgy0/claude-plusplus
          ref: 8311e3e11b6f45ac6c4d95ea6390547ef621642a
          path: .release-tools/claude-plusplus
          persist-credentials: false

      - name: Build Claude++ SDK and Runtime
        shell: pwsh
        working-directory: .release-tools/claude-plusplus
        run: |
          npm ci --ignore-scripts
          npm run build --workspace @claude-plusplus/sdk
          npm run build --workspace @claude-plusplus/runtime

      - name: Validate tweak with Claude++
        shell: pwsh
        run: |
          node --import ./.release-tools/claude-plusplus/node_modules/tsx/dist/loader.mjs `
            ./claude-tweak/scripts/compatibility/validate-claudeplusplus.mjs `
            ./.release-tools/claude-plusplus ./claude-tweak

      - name: Verify component release tags
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $components = @(
              @{ Path = "codex-tweak"; Version = (Get-Content codex-tweak/manifest.json -Raw | ConvertFrom-Json).version },
              @{ Path = "claude-tweak"; Version = (Get-Content claude-tweak/manifest.json -Raw | ConvertFrom-Json).version },
              @{ Path = "unity-package"; Version = (Get-Content unity-package/package.json -Raw | ConvertFrom-Json).version })
          foreach ($component in $components)
          {
              $path = $component.Path
              $tag = "v$($component.Version)"
              git -C $path fetch --tags origin
              $existing = git -C $path tag --list $tag
              if (!$existing)
              {
                  throw "$path does not have $tag."
              }
              $head = (git -C $path rev-parse HEAD).Trim()
              $tagCommit = (git -C $path rev-list -n 1 $tag).Trim()
              if ($head -ne $tagCommit)
              {
                  throw "$path is pinned at $head instead of $tagCommit for $tag."
              }
          }

      - name: Create or reuse release tag
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $tag = "v$env:RELEASE_VERSION"
          git fetch --tags origin
          $existing = git tag --list $tag
          if ($existing)
          {
              $target = (git rev-list -n 1 $tag).Trim()
              if ($target -ne $env:GITHUB_SHA)
              {
                  throw "Tag $tag points to $target instead of $env:GITHUB_SHA."
              }
          }
          else
          {
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git tag -a $tag $env:GITHUB_SHA -m "Unity Links $tag"
              git push origin "refs/tags/$tag"
          }
          "RELEASE_TAG=$tag" >> $env:GITHUB_ENV

      - name: Create Draft Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $existingReleaseTag = gh release list `
              --repo $env:GITHUB_REPOSITORY `
              --limit 100 `
              --json tagName `
              --jq ".[] | select(.tagName == `"$env:RELEASE_TAG`") | .tagName"
          if ($existingReleaseTag)
          {
              throw "Release already exists for tag: $existingReleaseTag"
          }

          $releaseUrl = gh release create $env:RELEASE_TAG `
              --repo $env:GITHUB_REPOSITORY `
              --verify-tag `
              --draft `
              --title "Unity Links $env:RELEASE_TAG" `
              --notes "Licensed under the MIT License. Review README.md and README.zh-CN.md for installation instructions." `
              --generate-notes
          "Draft Release: $releaseUrl" >> $env:GITHUB_STEP_SUMMARY
